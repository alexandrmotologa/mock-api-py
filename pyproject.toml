[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mock-api-py"
version = "0.1.0"
description = "Modern Instant Mock CRUD Engine with FastAPI, Rich CLI, and Chaos Testing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Alexandr Motologa" }
]
keywords = ["mock", "api", "fastapi", "rest", "json-server", "testing", "chaos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "faker>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
mock-api = "mock_api_py.cli:cli_entry"
fastmock = "mock_api_py.cli:cli_entry"

[tool.hatch.build.targets.wheel]
packages = ["mock_api_py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
