[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mock-api-py"
version = "0.1.2"
description = "Modern Instant Mock CRUD Engine with FastAPI, Rich CLI, and Chaos Testing"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Alexandr Motologa" }
]
keywords = ["mock", "api", "rest", "fastapi", "json-server", "chaos", "testing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "faker>=25.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
mock-api = "mock_api_py.cli:cli_entry"
fastmock = "mock_api_py.cli:cli_entry"
mock-api-py = "mock_api_py.cli:cli_entry"

[tool.hatch.build.targets.wheel]
packages = ["mock_api_py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
